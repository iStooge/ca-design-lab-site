                const button = document.getElementById("staticrypt-button"),
                    error = document.getElementById("staticrypt-error"),
                    label = button.value;
                const password = document.getElementById("staticrypt-password").value,
                    isRememberChecked = document.getElementById("staticrypt-remember").checked;

                error.classList.add("hidden");
                button.disabled = true;
                button.value = "Checking ...";

                const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);

                if (!isSuccessful) {
                    button.disabled = false;
                    button.value = label;
                    error.textContent = templateError;
                    error.classList.remove("hidden");
                    document.getElementById("staticrypt-password").select();
                }
            });
        </script>
    </body>
</html>
